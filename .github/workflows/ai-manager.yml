name: AI manager (free model team)
on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write
concurrency: { group: "ai-manager-${{ github.event.issue.number || 'queue' }}", cancel-in-progress: false }
jobs:
  build:
    if: github.event_name != 'issues' || github.event.label.name == 'ai-build'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Pick the labelled issue (parallel), or oldest queued on manual run
        id: pick
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -n "${{ github.event.issue.number }}" ]; then
            gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" | jq '[.]' > /tmp/i.json
          else
            gh api "repos/${{ github.repository }}/issues?labels=ai-build&state=open&sort=created&direction=asc&per_page=1" > /tmp/i.json
          fi
          echo "n=$(jq -r '.[0].number // empty' /tmp/i.json)" >> $GITHUB_OUTPUT
          jq -r '.[0].title // empty' /tmp/i.json > /tmp/title; jq -r '.[0].body // empty' /tmp/i.json > /tmp/body
      - uses: actions/checkout@v4
        if: steps.pick.outputs.n != ''
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.n != ''
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.n != ''
        with: { python-version: "3.12" }
      - if: steps.pick.outputs.n != ''
        run: npm ci --legacy-peer-deps
      - name: Pool token
        if: steps.pick.outputs.n != ''
        uses: actions/github-script@v7
        with:
          script: core.setSecret(await core.getIDToken('pwyl-ai-pool')); core.exportVariable('POOL_KEY', await core.getIDToken('pwyl-ai-pool'))
      - name: Build, test, review
        if: steps.pick.outputs.n != ''
        id: mgr
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_TEAM_KEY: ${{ secrets.GEMINI_TEAM_KEY }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.n }}
        run: |
          git config user.name "fanzeum-ai-team"; git config user.email "ai-team@users.noreply.github.com"
          export ISSUE_TITLE="$(cat /tmp/title)" ISSUE_BODY="$(cat /tmp/body)"
          git checkout -b "ai/issue-$ISSUE_NUMBER"
          python .github/manager/manager.py
      - name: Merge or report
        if: steps.pick.outputs.n != ''
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.pick.outputs.n }}
        run: |
          BR="ai/issue-$N"
          if [ "${{ steps.mgr.outputs.changed }}" = "true" ]; then git commit -qm "AI team: #$N $(cat /tmp/title)" || true; git push -q -f origin "$BR"; fi
          if [ "${{ steps.mgr.outputs.ok }}" = "true" ]; then
            merged=false
            for try in 1 2 3; do
              git checkout -q main && git reset -q --hard origin/main && git pull -q origin main
              if git merge -q --squash "$BR" && git commit -qm "AI team: closes #$N" && git push -q origin main; then merged=true; break; fi
              git merge --abort 2>/dev/null; git reset -q --hard origin/main; sleep $((RANDOM % 20 + 10))
            done
            if [ "$merged" != "true" ]; then
              { echo "Built and passed review, but clashed with another job when merging. Branch: \`$BR\`"; echo; cat /tmp/report.md; } > /tmp/c.md
              gh issue comment "$N" --body-file /tmp/c.md; gh issue edit "$N" --remove-label ai-build --add-label needs-review; exit 0
            fi
            { echo "Merged to main by the AI manager."; echo; cat /tmp/report.md; } > /tmp/c.md
            gh issue comment "$N" --body-file /tmp/c.md; gh issue close "$N"
          else
            { echo "Needs a human look. Branch: \`$BR\`"; echo; cat /tmp/report.md; } > /tmp/c.md
            gh issue comment "$N" --body-file /tmp/c.md; gh issue edit "$N" --remove-label ai-build --add-label needs-review
          fi
